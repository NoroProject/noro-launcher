[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Каждой ОС — свой системный сейф. Общая строка с одним лишь apple-native
# оставляла Windows и Linux на mock-хранилище: save отчитывался об успехе, а
# после перезапуска сессии не было, и лаунчер снова просил вход.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# linux-native — keyutils ядра, без dbus: Secret Service утащил бы C-зависимости
# в cross-сборку aarch64.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
