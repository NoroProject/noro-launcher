[package]
name = "frontend"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
schema = { workspace = true }
i18n = { workspace = true }
bridge = { workspace = true }

# GPUI from the Zed repository. font-kit + runtime_shaders on gpui_platform is
# what makes the bundled fonts load through the AssetSource. Pinned to a commit
# that builds on the stable toolchain (main uses the unstable cold_path).
# `x11` and `wayland` have to be named: Zed's workspace pulls gpui_linux in
# with default features off, and without them GPUI on Linux has no window
# backend and panics on start. Linking needs libxkbcommon-dev and
# libxkbcommon-x11-dev.
gpui = { git = "https://github.com/zed-industries/zed", rev = "ff8fa053ff0d0c02aec95def5b796dbe5cd541e1" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ff8fa053ff0d0c02aec95def5b796dbe5cd541e1", features = ["font-kit", "runtime_shaders", "x11", "wayland"] }

tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
reqwest = { workspace = true }
base64 = { workspace = true }
open = { workspace = true }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { workspace = true }
rust-embed = "8"
tracing = "0.1"
image = { workspace = true }
urlencoding = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false }
