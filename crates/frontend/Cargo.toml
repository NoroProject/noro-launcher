[package]
name = "frontend"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
schema = { workspace = true }
i18n = { workspace = true }
bridge = { workspace = true }

# GPUI из репозитория Zed. gpui_platform с font-kit + runtime_shaders — это и есть
# «фикс шрифтов»: текстовая система и встроенные шрифты грузятся через AssetSource.
# Пин на коммит, собирающийся на стабильном toolchain (main использует
# нестабильную cold_path). Это та же ревизия, что в референсном проекте.
gpui = { git = "https://github.com/zed-industries/zed", rev = "ff8fa053ff0d0c02aec95def5b796dbe5cd541e1" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ff8fa053ff0d0c02aec95def5b796dbe5cd541e1", features = ["font-kit", "runtime_shaders"] }

tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"] }
reqwest = { workspace = true }
base64 = { workspace = true }
open = { workspace = true }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { workspace = true }
rust-embed = "8"
tracing = "0.1"
image = { workspace = true }
urlencoding = { workspace = true }
pulldown-cmark = { version = "0.13", default-features = false }
