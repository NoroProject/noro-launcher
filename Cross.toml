# cross собирает внутри Docker-контейнера и пробрасывает туда только свой
# список переменных. Без этого NORO_MASTER_URL и NORO_SIGNING_PUBKEY не доходят
# до rustc, и release-сборка лаунчера падает на проверке в verify.rs — что она
# и сделала на aarch64-unknown-linux-gnu, единственном таргете через cross.
[build.env]
passthrough = ["NORO_MASTER_URL", "NORO_SIGNING_PUBKEY"]
