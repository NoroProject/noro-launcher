services:
  postgres:
    image: postgres:16-alpine
    container_name: noro-postgres
    environment:
      POSTGRES_DB: noro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - noro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noro"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - internal

  noro-master:
    image: ghcr.io/sidepilotapp/noro-master:latest
    container_name: noro-master
    environment:
      NORO_BIND: 0.0.0.0:8080
      NORO_PUBLIC_URL: https://api.${DOMAIN}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/noro
      NORO_DATA_DIR: /app/data
      NORO_GITHUB_REPO: ${NORO_GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      NORO_LAUNCHER_REPO: /app/launcher-repo
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY}
      NORO_SIGNING_KEY: ${NORO_SIGNING_KEY}
      # Без них вход через Discord молча не работает: мастер поднимается,
      # а /auth/discord/login уходит в Discord с пустым client_id.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      NORO_FILES_CDN_URL: https://noro-cdn.${DOMAIN}/files
      # Из браузера в API ходит только сайт. Без этой переменной CORS открыт
      # для любого origin (см. docs/env.md).
      NORO_ALLOWED_ORIGINS: https://${DOMAIN}
    volumes:
      - noro-data:/app/data
      - ./launcher-repo:/app/launcher-repo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.noro-master.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.noro-master.entrypoints=websecure
      - traefik.http.routers.noro-master.tls.certresolver=le
      - traefik.http.services.noro-master.loadbalancer.server.port=8080
      - traefik.http.routers.noro-cdn.rule=Host(`noro-cdn.${DOMAIN}`)
      - traefik.http.routers.noro-cdn.entrypoints=web,websecure
      - traefik.http.routers.noro-cdn.tls=true
      - traefik.http.routers.noro-cdn.service=noro-master
    restart: unless-stopped
    networks:
      - internal
      - traefik

  noro-web:
    image: ghcr.io/sidepilotapp/noro-web:latest
    container_name: noro-web
    environment:
      NUXT_PUBLIC_MASTER_URL: https://api.${DOMAIN}
      NUXT_PUBLIC_WEB_URL: https://${DOMAIN}
    depends_on:
      - noro-master
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.noro-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.noro-web.entrypoints=websecure
      - traefik.http.routers.noro-web.tls.certresolver=le
      - traefik.http.services.noro-web.loadbalancer.server.port=3000
    restart: unless-stopped
    networks:
      - internal
      - traefik

volumes:
  noro-postgres:
  noro-data:

networks:
  internal:
    name: noro-internal
  traefik:
    external: true
