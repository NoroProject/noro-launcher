services:
  postgres:
    image: postgres:16-alpine
    container_name: noro-postgres
    environment:
      POSTGRES_DB: noro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - noro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  noro-postgres:
