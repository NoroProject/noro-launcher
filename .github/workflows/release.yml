name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      NORO_MASTER_URL: "https://api.dalynkaa.dev"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            extension: .exe
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross
        
      - name: Build binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release -p master --bin noro-master --target ${{ matrix.target }}
            cross build --release -p noro_launcher --bin noro-launcher --target ${{ matrix.target }}
          else
            cargo build --release -p master --bin noro-master --target ${{ matrix.target }}
            cargo build --release -p noro_launcher --bin noro-launcher --target ${{ matrix.target }}
          fi
        shell: bash
        
      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/noro-master.exe dist/noro-master-${{ matrix.target }}.exe
            cp target/${{ matrix.target }}/release/noro-launcher.exe dist/noro-launcher-${{ matrix.target }}.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            # Упаковываем master как обычный бинарник
            cp target/${{ matrix.target }}/release/noro-master dist/noro-master-${{ matrix.target }}
            
            # Упаковываем launcher как .app
            APP_NAME="NoroLauncher.app"
            mkdir -p "$APP_NAME/Contents/MacOS"
            mkdir -p "$APP_NAME/Contents/Resources"
            cp target/${{ matrix.target }}/release/noro-launcher "$APP_NAME/Contents/MacOS/"
            
            cat > "$APP_NAME/Contents/Info.plist" <<EOF
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>CFBundleExecutable</key>
                <string>noro-launcher</string>
                <key>CFBundleIdentifier</key>
                <string>com.nexbitstd.norolauncher</string>
                <key>CFBundleName</key>
                <string>NoroLauncher</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>CFBundleVersion</key>
                <string>1</string>
                <key>LSMinimumSystemVersion</key>
                <string>10.13</string>
            </dict>
            </plist>
            EOF
            
            # Архивируем .app в tar.gz чтобы сохранить права доступа
            tar -czf dist/noro-launcher-${{ matrix.target }}.app.tar.gz "$APP_NAME"
          else
            cp target/${{ matrix.target }}/release/noro-master dist/noro-master-${{ matrix.target }}
            cp target/${{ matrix.target }}/release/noro-launcher dist/noro-launcher-${{ matrix.target }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
