name: Build and Push Docker Images

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Всё собирается нативно на self-hosted `noro-arm64` — прод arm64, и платные
  # минуты GitHub-hosted раннеров не тратятся. Раньше матрица держала ещё amd64
  # на `ubuntu-latest`; образов под эту платформу больше нет, и если она снова
  # понадобится, вернуть её придётся вместе со счётом за минуты.
  #
  # Сборка пушит образ по digest, без тега: тег ставится один раз в `merge`.
  # Иначе `latest` успевал бы побывать промежуточным между пушами.
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [noro-master, noro-web]
        # Только arm64: прод и так arm64, а amd64 собирался на GitHub-hosted
        # раннере и выбирал платные минуты. Self-hosted `noro-arm64` бесплатен.
        platform: [arm64]
        include:
          - image: noro-master
            file: ./Dockerfile.master
          - image: noro-web
            file: ./Dockerfile.web
    runs-on: noro-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
        shell: bash

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.image }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Scope включает и образ, и платформу: с общим scope половины матрицы
          # затирали кеш друг друга и каждая сборка начиналась почти с нуля.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" >"/tmp/digests/${{ matrix.platform }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  # Склейка мультиарх-манифеста из готовых digest'ов. Только здесь появляются
  # `latest`, `sha-…` и теги релиза.
  merge:
    needs: build
    # Тоже на self-hosted: job лёгкий, но на GitHub-hosted он всё равно тратил
    # платные минуты.
    runs-on: noro-arm64
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [noro-master, noro-web]

    steps:
      - name: Set environment variables
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
        shell: bash

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"${DOCKER_METADATA_OUTPUT_JSON}") \
            $(for f in *; do printf '%s/%s/%s@%s ' "${REGISTRY}" "${REPO_OWNER}" "${{ matrix.image }}" "$(cat "$f")"; done)

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${REPO_OWNER}/${{ matrix.image }}:${{ steps.meta.outputs.version }}"
