# Launcher release. The master server triggers this via workflow_dispatch and
# then waits on it: it collects the release assets, signs core and lays them out
# per platform. The tag in `run-name` is the only way to match a run to a job —
# workflow_dispatch doesn't return a run id.
name: Release Launcher

run-name: launcher ${{ inputs.tag || github.ref_name }} [${{ inputs.job_id || 'push' }}]

on:
  # Fallback path: without a GITHUB_TOKEN the master has no other way to build.
  push:
    tags:
      - 'v*'
      - 'launcher-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. launcher-v1.4.0
        required: true
        type: string
      job_id:
        description: Master job id, used to match up the run
        required: false
        default: manual
        type: string

permissions:
  contents: write

env:
  # Optional. Empty means the launcher builds without Sentry and sends nothing.
  # `vars` rather than `secrets` on purpose: the DSN ends up inside binaries on
  # players' machines anyway, so hiding it from build logs proves nothing.
  NORO_SENTRY_DSN: ${{ vars.NORO_SENTRY_DSN }}
  # From the tag, not Cargo.toml — the manifest lags behind and crashes would be
  # filed against the previous release.
  NORO_RELEASE: ${{ inputs.tag || github.ref_name }}
  # Both are implied by the org token; spelled out so it's visible where symbols
  # go without decoding it.
  SENTRY_ORG: dalynkaa
  SENTRY_PROJECT: noro-launcher
  SENTRY_URL: https://de.sentry.io
  # On a tag push inputs are empty and the tag comes from the ref.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guard:
    name: Check release vars
    runs-on: ubuntu-latest
    steps:
      - name: Sentry notice
        run: |
          set -euo pipefail
          [ -n "${NORO_SENTRY_DSN:-}" ] || echo "::notice::NORO_SENTRY_DSN is unset — building without crash reporting"

      # The launcher compares its own CARGO_PKG_VERSION against the tag the
      # master hands out. If they drift, the "update available" banner never
      # goes away and installing it fetches the same build again.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag matches Cargo.toml version
        run: |
          set -euo pipefail
          MANIFEST=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$MANIFEST" ] && [ "$TAG" != "launcher-v$MANIFEST" ]; then
            echo "::error::tag $TAG does not match the Cargo.toml version ($MANIFEST). Expected v$MANIFEST or launcher-v$MANIFEST"
            exit 1
          fi
          echo "tag and manifest agree: $TAG"

  build:
    name: launcher ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The action above adds the target to stable, but rust-toolchain.toml pins
      # a different version and rustup switches to it on the first cargo call.
      # The target isn't installed there, so the build dies with `can't find
      # crate for core` — but only where the target differs from the runner's
      # host, i.e. on x86_64 macOS.
      - name: Add the target to the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          rustup toolchain install "$CHANNEL" --profile minimal
          rustup target add --toolchain "$CHANNEL" ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: launcher-${{ matrix.target }}

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # release-symbols, not release: same optimised code plus the string
          # tables Sentry needs. See [profile.release-symbols] in Cargo.toml.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --profile release-symbols -p noro_launcher --bin noro-launcher --target ${{ matrix.target }}
            cross build --profile release-symbols -p noro_core --bin noro-launcher-core --target ${{ matrix.target }}
          else
            cargo build --profile release-symbols -p noro_launcher --bin noro-launcher --target ${{ matrix.target }}
            cargo build --profile release-symbols -p noro_core --bin noro-launcher-core --target ${{ matrix.target }}
          fi

      # Skipped quietly without a token: forks and outside runs should build,
      # not fail on our telemetry.
      - name: Upload debug files to Sentry
        if: env.SENTRY_AUTH_TOKEN != '' && env.NORO_SENTRY_DSN != ''
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # npm rather than `curl | bash` — this step also runs on the Windows
          # runner, where the get-cli installer doesn't work.
          npm install -g @sentry/cli@2
          DIR="target/${{ matrix.target }}/release-symbols"

          # On macOS debug info stays in the .o files by default and the binary
          # alone is useless to Sentry. dsymutil gathers it into a .dSYM.
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            dsymutil "$DIR/noro-launcher-core" "$DIR/noro-launcher"
          fi

          # --include-sources ships the code next to the symbols, so traces show
          # the source lines and not just their numbers.
          sentry-cli debug-files upload \
            --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            --include-sources --wait \
            "$DIR" 2>&1 | tee dif-upload.log

          # "Found 0" means no symbols for this target and traces will come in
          # without names. Worth saying out loud, not worth failing the release.
          grep -qE "Found [1-9]" dif-upload.log \
            || echo "::warning::Sentry found no symbols in $DIR — traces for this target will be unnamed"

      - name: Import signing certificate
        if: matrix.os == 'macos-latest' && env.MACOS_CERT_P12 != ''
        shell: bash
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(uuidgen)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*\"(.*)\"/\1/')" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT=target/${{ matrix.target }}/release-symbols
          case "${{ matrix.os }}" in
            windows-latest)
              cp "$OUT/noro-launcher.exe" dist/noro-launcher-${{ matrix.target }}.exe
              cp "$OUT/noro-launcher-core.exe" dist/noro-launcher-core-${{ matrix.target }}.exe
              ;;
            macos-latest)
              cp "$OUT/noro-launcher" dist/noro-launcher-${{ matrix.target }}
              cp "$OUT/noro-launcher-core" dist/noro-launcher-core-${{ matrix.target }}
              IDENTITY="${MACOS_SIGN_IDENTITY:--}"
              if [ "$IDENTITY" = "-" ]; then
                codesign --force --sign - --timestamp=none "dist/noro-launcher-${{ matrix.target }}"
                codesign --force --sign - --timestamp=none "dist/noro-launcher-core-${{ matrix.target }}"
              else
                codesign --force --sign "$IDENTITY" --options runtime --timestamp "dist/noro-launcher-${{ matrix.target }}"
                codesign --force --sign "$IDENTITY" --options runtime --timestamp "dist/noro-launcher-core-${{ matrix.target }}"
              fi
              bash .github/scripts/make-app.sh "$OUT/noro-launcher" NoroLauncher.app "${TAG#v}"
              tar -czf "dist/noro-launcher-${{ matrix.target }}.app.tar.gz" NoroLauncher.app
              bash .github/scripts/make-dmg.sh NoroLauncher.app dist/noro-launcher-${{ matrix.target }}.dmg
              bash .github/scripts/notarize.sh dist/noro-launcher-${{ matrix.target }}.dmg
              ;;
            *)
              cp "$OUT/noro-launcher" dist/noro-launcher-${{ matrix.target }}
              cp "$OUT/noro-launcher-core" dist/noro-launcher-core-${{ matrix.target }}
              # On Linux debug info lives inside the ELF rather than in a
              # separate .dSYM or .pdb. Sentry already has it from the step
              # above, so players don't need to carry it — unstripped, the
              # aarch64 build is roughly three times the size.
              #
              # aarch64 needs its own strip: the runner is x86_64, the binutils
              # strip won't touch a foreign ELF, and llvm-strip isn't installed.
              if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
                sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
                STRIP="aarch64-linux-gnu-strip"
              else
                STRIP="strip"
              fi
              # Fail rather than warn — a silent skip here ships players a much
              # larger binary and nothing else catches it.
              "$STRIP" --strip-debug dist/noro-launcher-${{ matrix.target }} \
                dist/noro-launcher-core-${{ matrix.target }}
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The master waits for a release under this exact tag and reads the
      # noro-launcher-core-* assets from it.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ env.TAG }}

  sentry-release:
    name: Sentry release
    needs: release
    runs-on: ubuntu-latest
    # A build without telemetry is still a complete build.
    if: vars.NORO_SENTRY_DSN != ''
    steps:
      # Full history: set-commits has nothing to associate without it, and
      # Sentry can't show which change introduced a crash.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Create release and associate commits
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SENTRY_AUTH_TOKEN:-}" ] || { echo "::error::SENTRY_AUTH_TOKEN is not set in secrets"; exit 1; }
          npm install -g @sentry/cli@2
          # The release name has to match what NORO_RELEASE baked into the
          # binary, or crashes hang off a release that doesn't exist.
          sentry-cli releases new "$NORO_RELEASE"
          sentry-cli releases set-commits "$NORO_RELEASE" --auto --ignore-missing
          sentry-cli releases finalize "$NORO_RELEASE"
