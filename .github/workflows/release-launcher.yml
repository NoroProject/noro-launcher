# Релиз лаунчера. Запускается мастером через workflow_dispatch и ждёт его же:
# мастер потом забирает ассеты релиза, подписывает core и раскладывает по
# платформам. Тег в `run-name` — единственный способ сопоставить запуск с
# задачей: workflow_dispatch не возвращает id запуска.
name: Release Launcher

run-name: launcher ${{ inputs.tag || github.ref_name }} [${{ inputs.job_id || 'push' }}]

on:
  # Запасной путь: без GITHUB_TOKEN у мастера собрать лаунчер больше нечем.
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, например launcher-v1.4.0
        required: true
        type: string
      job_id:
        description: id задачи мастера, для сопоставления запуска
        required: false
        default: manual
        type: string

permissions:
  contents: write

env:
  # Оба обязательны: без них release-сборка bootstrapper'а не компилируется —
  # см. crates/noro_launcher/src/verify.rs.
  NORO_MASTER_URL: ${{ vars.NORO_MASTER_URL }}
  NORO_SIGNING_PUBKEY: ${{ vars.NORO_SIGNING_PUBKEY }}
  # На push тега inputs пустые — тег берётся из ссылки.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guard:
    name: Check release vars
    runs-on: ubuntu-latest
    steps:
      # Падать здесь, а не на пятой матрице через двадцать минут.
      - name: Vars present
        run: |
          set -euo pipefail
          [ -n "${NORO_MASTER_URL:-}" ] || { echo "::error::переменная NORO_MASTER_URL не задана в настройках репозитория"; exit 1; }
          [ -n "${NORO_SIGNING_PUBKEY:-}" ] || { echo "::error::переменная NORO_SIGNING_PUBKEY не задана — иначе доверенным станет dev-ключ"; exit 1; }

  build:
    name: launcher ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    env:
      # На уровне job, а не шага: в `if` шага его собственный env недоступен,
      # и условие «есть ли сертификат» иначе всегда ложно.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: launcher-${{ matrix.target }}

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release -p noro_launcher --bin noro-launcher --target ${{ matrix.target }}
            cross build --release -p noro_core --bin noro-launcher-core --target ${{ matrix.target }}
          else
            cargo build --release -p noro_launcher --bin noro-launcher --target ${{ matrix.target }}
            cargo build --release -p noro_core --bin noro-launcher-core --target ${{ matrix.target }}
          fi

      # Секретов может не быть (форк, чужой прогон) — тогда подпись остаётся
      # ad-hoc, и сборка всё равно проходит.
      - name: Import signing certificate
        if: matrix.os == 'macos-latest' && env.MACOS_CERT_P12 != ''
        shell: bash
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(uuidgen)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p dist
          OUT=target/${{ matrix.target }}/release
          case "${{ matrix.os }}" in
            windows-latest)
              cp "$OUT/noro-launcher.exe" dist/noro-launcher-${{ matrix.target }}.exe
              cp "$OUT/noro-launcher-core.exe" dist/noro-launcher-core-${{ matrix.target }}.exe
              ;;
            macos-latest)
              cp "$OUT/noro-launcher-core" dist/noro-launcher-core-${{ matrix.target }}
              bash .github/scripts/make-app.sh "$OUT/noro-launcher" NoroLauncher.app
              bash .github/scripts/make-dmg.sh NoroLauncher.app dist/noro-launcher-${{ matrix.target }}.dmg
              bash .github/scripts/notarize.sh dist/noro-launcher-${{ matrix.target }}.dmg
              ;;
            *)
              cp "$OUT/noro-launcher" dist/noro-launcher-${{ matrix.target }}
              cp "$OUT/noro-launcher-core" dist/noro-launcher-core-${{ matrix.target }}
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Мастер ждёт именно релиз с этим тегом и читает из него ассеты
      # noro-launcher-core-*.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ env.TAG }}
