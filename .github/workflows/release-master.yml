# Релиз мастер-ноды. Отдельно от лаунчера: у них разный цикл жизни — мастер
# катится когда угодно, а лаунчер собирается по команде самого мастера.
name: Release Master

on:
  push:
    tags:
      - 'master-v*'
  workflow_dispatch:

permissions:
  contents: write

# Только arm64 и только на self-hosted `noro-arm64`: прод arm64, а
# GitHub-hosted раннеры выбирали платные минуты. На arm-раннере этот target
# нативный, поэтому `cross` больше не нужен. Бинарника под x86_64 теперь нет —
# вернуть его без GitHub-hosted раннера не выйдет.
jobs:
  build:
    name: master aarch64-unknown-linux-gnu
    runs-on: noro-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: master-aarch64-unknown-linux-gnu

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          target=aarch64-unknown-linux-gnu
          cargo build --release -p master --bin noro-master --target "$target"
          mkdir -p dist
          cp "target/$target/release/noro-master" "dist/noro-master-$target"

      - uses: actions/upload-artifact@v4
        with:
          name: master-aarch64-unknown-linux-gnu
          path: dist/*

  release:
    name: Publish
    needs: build
    runs-on: noro-arm64
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
