# Релиз мастер-ноды. Отдельно от лаунчера: у них разный цикл жизни — мастер
# катится когда угодно, а лаунчер собирается по команде самого мастера.
name: Release Master

on:
  push:
    tags:
      - 'master-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: master ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: master-${{ matrix.target }}

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release -p master --bin noro-master --target ${{ matrix.target }}
          else
            cargo build --release -p master --bin noro-master --target ${{ matrix.target }}
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/noro-master dist/noro-master-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: master-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
