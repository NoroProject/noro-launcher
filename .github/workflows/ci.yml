# Проверка кода на каждый PR и push в master.
#
# До этого CI собирал только релизы и образы: ни fmt, ни clippy, ни тестов.
# INSTRUCTIONS.md при этом утверждал, что «clippy warnings are errors in CI» —
# такого workflow не существовало.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Новый push в ту же ветку отменяет предыдущий прогон: раннер self-hosted и
# один, очередь из устаревших прогонов блокировала бы актуальный.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust fmt + clippy + test
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-rust

      # Форматирование проверяется по всему воркспейсу: rustfmt не требует
      # сборки и потому не упирается в системные зависимости GPUI.
      - name: fmt
        run: cargo fmt --all -- --check

      # Серверная часть: она деплоится непрерывно, и регресс здесь виден не
      # сразу. Крейты с GPUI проверяет отдельный джоб ниже — на self-hosted
      # раннере может не быть системных библиотек, которых требует их сборка.
      - name: clippy
        run: |
          cargo clippy --all-targets \
            -p schema -p i18n -p bridge -p mod_link -p backend -p master -p admin_cli \
            -- -D warnings

      - name: test
        run: cargo test -p schema -p i18n -p bridge -p mod_link -p backend -p master -p admin_cli

  # Лаунчер. Раньше его крейты не проверялись вовсе, и в них накопились мёртвые
  # функции и неиспользуемые импорты — их не видел никто, потому что release
  # собирает бинарник без clippy.
  #
  # `ubuntu-latest`, а не self-hosted: release-launcher уже собирает на нём
  # `x86_64-unknown-linux-gnu` без доустановки пакетов, то есть GPUI там
  # компилируется. Перенос на self-hosted сэкономит минуты GitHub, но сперва
  # надо убедиться, что на раннере есть те же системные библиотеки.
  launcher:
    name: launcher clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-launcher

      - name: clippy
        run: |
          cargo clippy --all-targets \
            -p frontend -p noro_launcher -p noro_core \
            -- -D warnings

  web:
    name: web typecheck
    runs-on: [self-hosted, Linux]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # --frozen-lockfile: CI не должен молча подтягивать версии, которых нет
      # в bun.lock, иначе прогон проверяет не то, что уедет в прод.
      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck
