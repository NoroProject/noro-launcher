# Checks on every PR and every push to master.
name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  # GPUI links against these on Linux: xkbcommon for its X11 and Wayland
  # backends, fontconfig and freetype for text.
  LINUX_DEPS: libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev

jobs:
  rust:
    name: rust fmt + clippy + test
    # GitHub-hosted: a pull request runs whatever its author wrote, and a
    # self-hosted machine that is switched off leaves every check queued.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-rust

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: |
          cargo clippy --locked --all-targets \
            -p bridge -p mod_link -p backend \
            -- -D warnings

      - name: test
        run: cargo test --locked -p bridge -p mod_link -p backend

  launcher:
    name: launcher clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-launcher

      - name: system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $LINUX_DEPS

      - name: clippy
        run: |
          cargo clippy --locked --all-targets \
            -p frontend -p noro_launcher -p noro_core \
            -- -D warnings

      - name: test
        run: cargo test --locked -p frontend -p noro_launcher -p noro_core

  # Windows and macOS code (named pipes, keyring backends, the console window,
  # biometrics) otherwise first compiles in the release workflow.
  platforms:
    name: check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      - name: clippy
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
