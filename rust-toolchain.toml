# The toolchain version is pinned deliberately.
#
# CI runs clippy with `-D warnings`. On a floating stable that means a new Rust
# release turns the build red without a single change to the code, since every
# release brings new lints.
#
# Bump this in its own commit, together with whatever the newer clippy finds.
#
# Locally it only takes effect through rustup — if `rustc` comes from Homebrew
# the file is ignored and you keep drifting from CI.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
