[workspace]
resolver = "2"
members = [
    "crates/bridge",
    "crates/mod_link",
    "crates/backend",
    "crates/frontend",
    "crates/noro_launcher",
    "crates/noro_core",
]

[workspace.package]
version = "2.0.10"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["noro"]

[workspace.dependencies]
# Protocol and utilities shared with the master server.
schema = { git = "https://github.com/NoroProject/noro-shared.git", package = "schema", branch = "master" }
i18n = { git = "https://github.com/NoroProject/noro-shared.git", package = "i18n", branch = "master" }
mc_mod_utils = { git = "https://github.com/NoroProject/noro-shared.git", package = "mc_mod_utils", branch = "master" }

bridge = { path = "crates/bridge" }
mod_link = { path = "crates/mod_link" }
backend = { path = "crates/backend" }

# GPUI from the Zed repository, one pin for the launcher and the bootstrapper's
# splash: two revisions would build two incompatible copies. Pinned to a commit
# that builds on the stable toolchain (main uses the unstable cold_path).
#
# font-kit + runtime_shaders is what makes the bundled fonts load through the
# AssetSource. `x11` and `wayland` have to be named: Zed's workspace pulls
# gpui_linux in with default features off, and without them GPUI on Linux has
# no window backend and panics on start. Linking needs libxkbcommon-dev,
# libxkbcommon-x11-dev, libfontconfig-dev and libfreetype-dev.
gpui = { git = "https://github.com/zed-industries/zed", rev = "ff8fa053ff0d0c02aec95def5b796dbe5cd541e1" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ff8fa053ff0d0c02aec95def5b796dbe5cd541e1", features = ["font-kit", "runtime_shaders", "x11", "wayland"] }

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
futures-util = "0.3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Types
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Errors and logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sentry = { version = "0.34", default-features = false, features = [
    "backtrace",
    "contexts",
    # Loaded images and their build ids. Without this Sentry can't symbolicate
    # a trace and you get bare addresses.
    "debug-images",
    "panic",
    "reqwest",
    # rustls so the image doesn't need system OpenSSL.
    "rustls",
] }
sentry-tracing = "0.34"

# WebSocket client to the master
# Both root sets: the bundled one, and the system store, where antivirus HTTPS
# scanning (Kaspersky, ESET) and corporate proxies put their own CA. With the
# bundled set alone every request failed on those machines.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    # The system certificate store too; see tokio-tungstenite above.
    "rustls-tls-native-roots",
    "multipart",
    # Without it the h2 crate never makes it into the build and the launcher
    # fetches thousands of assets over HTTP/1.1, one request per connection.
    "http2",
] }

# Crypto and hashes
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Utilities
parking_lot = "0.12"
once_cell = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
zip = "2"
# Decompress logs/*.log.gz so the contents can be sanitised before upload —
# sending the archive as-is would send tokens we never looked at.
flate2 = "1"
# NBT, for the game client's servers.dat
fastnbt = "2"
walkdir = "2"
# Free disk space. Running out is the most common cause of a failed download
# and shows up in no game log; libc is in the tree anyway.
libc = "0.2"
dirs = "5"
# The platform backend is selected per target in crates/backend. Without one,
# keyring 3 quietly falls back to an in-memory mock.
keyring = { version = "3", default-features = false }
urlencoding = "2"
# System notifications. `z` is zbus, pure Rust: the `d` feature would pull in
# libdbus and break the cross build for aarch64. macOS and Windows have their
# own backends, and the choice here doesn't affect them.
notify-rust = { version = "4", default-features = false, features = ["z"] }
open = "5"
discord-rich-presence = "0.2.4"
regex = "1"
# The OS language on every platform. `LANG` alone is unset on Windows, so
# Russian-speaking Windows players started in English.
sys-locale = "0.3"

# Debug build: our own code without optimisations, dependencies with them.
#
# GPUI, image decoding and text layout run many times slower in debug, and the
# cost shows right in the window: a mod list with a couple of dozen icons ran
# at 6 fps, 311 ms a frame, while the same screen without images took 30 ms.
# That isn't the interface, it's unoptimised dependencies.
#
# Dependencies are built once and then cached, so this doesn't slow down
# edits: only the launcher's own code is recompiled.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# `true` (= "symbols") also strips the symbol table, which left crash traces
# from players as bare addresses. "debuginfo" keeps function names.
strip = "debuginfo"

# Release launcher build: the same optimised code plus the string tables Sentry
# needs for line numbers and sources. A separate profile so the master image
# doesn't grow for nothing.
#
# Players don't carry the extra weight: on macOS debug info lives in a .dSYM
# alongside, on Windows in a .pdb, and on Linux it sits inside the ELF until CI
# strips it after uploading symbols.
[profile.release-symbols]
inherits = "release"
debug = "line-tables-only"
strip = "none"
